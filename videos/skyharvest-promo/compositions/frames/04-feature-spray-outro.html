  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-0.4s): stack holds; kicker ticks feature 02 -> feature 03 ----
      var kickerEl = document.getElementById("f4-kicker");
      var KICKER_SEQUENCE = [
        { t: 0.0, text: "feature 02" },
        { t: 0.2, text: "feature 03" },
        { t: 1.6, text: "03/03" },
      ];
      function kickerTextAt(time) {
        for (var i = KICKER_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= KICKER_SEQUENCE[i].t) return KICKER_SEQUENCE[i].text;
        }
        return "";
      }
      var kickerDriver = { t: 0 };
      tl.to(
        kickerDriver,
        {
          t: 5,
          duration: 5,
          ease: "none",
          onUpdate: function () {
            kickerEl.textContent = kickerTextAt(kickerDriver.t);
          },
        },
        0
      );
      // quick opacity "tick" blips landing on each text swap
      tl.to("#f4-kicker", { opacity: 0, duration: 0.08, ease: "power1.in" }, 0.12)
        .to("#f4-kicker", { opacity: 1, duration: 0.08, ease: "power1.out" }, 0.2);
      tl.to("#f4-kicker", { opacity: 0, duration: 0.08, ease: "power1.in" }, 1.52)
        .to("#f4-kicker", { opacity: 1, duration: 0.08, ease: "power1.out" }, 1.6);

      // ---- Scene 2 (0.4-1.6s): stack steps up one slot; third card springs into focal ----
      var STEP_START = 0.4;
      var STEP_DUR = 0.5;

      // card A: dimmed slot (18cqh) -> further-dimmed top slot (2cqh), cream-muted -> cream-hint
      // (transform-only: animate y by the -16cqh slot delta instead of layout-triggering top)
      tl.to("#f4-card-a", { y: "-16cqh", duration: STEP_DUR, ease: "back.out(1.5)" }, STEP_START);
      // frame.md's cream-hint (#505048) falls under WCAG AA 3:1 on ink-black at this size;
      // use a lightened variant that keeps the same dimmed-tier read and clears contrast.
      tl.to("#f4-card-a-text", { color: "rgb(105,105,98)", duration: STEP_DUR, ease: "power2.out" }, STEP_START);
      tl.to("#f4-card-a-bullet", { opacity: 0.3, duration: STEP_DUR, ease: "power2.out" }, STEP_START);

      // card B: focal slot (34cqh) -> dimmed slot (18cqh), cream -> cream-muted
      tl.to("#f4-card-b", { y: "-16cqh", duration: STEP_DUR, ease: "back.out(1.5)" }, STEP_START);
      tl.to("#f4-card-b-text", { color: "#888880", duration: STEP_DUR, ease: "power2.out" }, STEP_START);
      tl.to("#f4-card-b-bullet", { opacity: 0.55, duration: STEP_DUR, ease: "power2.out" }, STEP_START);

      // stub rule fades out as the old focal card leaves the slot
      tl.to("#f4-rule", { opacity: 0, duration: 0.2, ease: "power1.in" }, STEP_START);

      // card C: marker spring-pop (bullet) + bullet draw-in + pill mask-wipe text reveal
      tl.fromTo(
        "#f4-card-c-bullet",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" },
        0.55
      );
      tl.fromTo(
        "#f4-card-c-mask",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" },
        0.65
      );

      // stub rule fades back in under the new focal card (same fixed focal-slot position)
      tl.to("#f4-rule", { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.05);

      // ---- Scene 3 (1.6-2.6s): completed three-card stack holds; kicker reads 03/03 ----
      // (kicker tick already scheduled above; no further motion — held read)

      // ---- Scene 4 (2.6-3.4s): stack + kicker clear off-frame — grid slide-up fly-out ----
      var FLY_START = 2.6;
      var FLY_DUR = 0.55;
      var FLY_Y = -140;
      tl.to("#f4-kicker", { y: FLY_Y, opacity: 0, duration: FLY_DUR, ease: "power2.in" }, FLY_START);
      tl.to("#f4-card-a", { y: FLY_Y, opacity: 0, duration: FLY_DUR, ease: "power2.in" }, FLY_START + 0.04);
      tl.to("#f4-card-b", { y: FLY_Y, opacity: 0, duration: FLY_DUR, ease: "power2.in" }, FLY_START + 0.08);
      tl.to("#f4-card-c", { y: FLY_Y, opacity: 0, duration: FLY_DUR, ease: "power2.in" }, FLY_START + 0.12);
      tl.to("#f4-rule", { y: FLY_Y, opacity: 0, duration: FLY_DUR, ease: "power2.in" }, FLY_START + 0.16);

      // ---- Scene 5 (3.4-5.0s): SkyHarvest wordmark settles center with a soft reprised glow bloom ----
      var GLOW_START = 3.4;
      tl.fromTo(
        "#f4-glow",
        { opacity: 0, scale: 0.82 },
        { opacity: 0.26, scale: 1, duration: 0.9, ease: "power2.out" },

      );

        GLOW_START + 0.1
      );

      window.__timelines["04-feature-spray-outro"] = tl;
    })();
